services:
  init-headscale-config:
    image: alpine:latest
    restart: "no"
    volumes:
      - ./control-plane/headscale/config.example.yaml:/src/config.example.yaml:ro
      - headscale-config:/etc/headscale
    environment:
      - CONTROL_PLANE_DOMAIN=${CONTROL_PLANE_DOMAIN}
    command:
      - sh
      - -c
      - |
        sed "s|server_url: https://CONTROL_PLANE_DOMAIN|server_url: ${CONTROL_PLANE_DOMAIN}|g" /src/config.example.yaml > /etc/headscale/config.yaml

        grep -q "^noise:" /etc/headscale/config.yaml || cat >> /etc/headscale/config.yaml <<'EOF'

        noise:
          private_key_path: /var/lib/headscale/noise_private.key
        EOF

        sed -i 's|override_local_dns: true|override_local_dns: false|g' /etc/headscale/config.yaml

        echo "Generated config:"
        grep -E "server_url:|override_local_dns:|private_key_path:" /etc/headscale/config.yaml

  headscale:
    image: docker.io/headscale/headscale:0.28.0@sha256:51b1b9182bb6219e97374fa89af6b9320d6f87ecc739e328d5357ea4fa7a5ce3
    restart: unless-stopped
    volumes:
      - headscale-config:/etc/headscale
      - headscale-data:/var/lib/headscale
    tmpfs:
      - /var/run/headscale
    command: serve
    depends_on:
      init-headscale-config:
        condition: service_completed_successfully

  ui:
    build: ./control-plane/mesh-ui
    restart: unless-stopped
    volumes:
      - ./control-plane/nginx.conf:/etc/nginx/nginx.conf.template
    environment:
      - CORS_ORIGIN=${CORS_ORIGIN}
      - NGINX_MODE=prod
    depends_on:
      - headscale
    entrypoint: /bin/sh
    command:
      - -c
      - |
        envsubst '$$CORS_ORIGIN $$NGINX_MODE' < /etc/nginx/nginx.conf.template > /tmp/nginx.conf
        nginx -c /tmp/nginx.conf -g 'daemon off;'

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - ui

volumes:
  headscale-config:
  headscale-data:
