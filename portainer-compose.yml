services:
  init-headscale-config:
    image: alpine:latest
    restart: "no"
    volumes:
      - ./control-plane/headscale:/work
    environment:
      - CONTROL_PLANE_DOMAIN=${CONTROL_PLANE_DOMAIN}
    command:
      - sh
      - -c
      - |
        if [ ! -f /work/config.yaml ]; then
          sed "s|CONTROL_PLANE_DOMAIN|${CONTROL_PLANE_DOMAIN}|g" /work/config.example.yaml > /work/config.yaml
        fi
        echo "Headscale config ready"

  headscale:
    image: docker.io/headscale/headscale:0.28.0@sha256:51b1b9182bb6219e97374fa89af6b9320d6f87ecc739e328d5357ea4fa7a5ce3
    restart: unless-stopped
    volumes:
      - ./control-plane/headscale:/etc/headscale
      - headscale-data:/var/lib/headscale
    tmpfs:
      - /var/run/headscale
    command: serve
    depends_on:
      init-headscale-config:
        condition: service_completed_successfully

  ui:
    build: ./control-plane/mesh-ui
    restart: unless-stopped
    volumes:
      - ./control-plane/nginx.conf:/etc/nginx/nginx.conf.template
    environment:
      - CORS_ORIGIN=${CORS_ORIGIN}
      - NGINX_MODE=prod
    depends_on:
      - headscale
    entrypoint: /bin/sh
    command:
      - -c
      - |
        envsubst '$$CORS_ORIGIN $$NGINX_MODE' < /etc/nginx/nginx.conf.template > /tmp/nginx.conf
        nginx -c /tmp/nginx.conf -g 'daemon off;'

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - ui

volumes:
  headscale-data:
